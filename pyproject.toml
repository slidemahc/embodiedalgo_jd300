[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "slidemahc-embodiedalgo_jd300"
version = "0.1.0"
description = "把输入按语义边界切成独立单元，逐单元核对具身智能算法工程师·向量索引的召回与构建代价相关的特征并标出命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "slidemahc" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://slidemahc.github.io"
Repository = "https://github.com/slidemahc/embodiedalgo_jd300"
Issues = "https://github.com/slidemahc/embodiedalgo_jd300/issues"

[project.scripts]
embodiedalgo_jd300 = "embodiedalgo_jd300:main"

[tool.setuptools]
py-modules = ["embodiedalgo_jd300"]
